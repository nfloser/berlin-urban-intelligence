[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "berlin-urban-intelligence"
version = "0.1.0"
description = "Agent-extensible urban intelligence and digital-twin research platform for Berlin"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "networkx>=3.3,<4",
  "pydantic>=2.9,<3",
  "pyproj>=3.6,<4",
  "rdflib>=7,<8",
  "shapely>=2.0,<3",
  "uvicorn[standard]>=0.30,<1",
  "PyYAML>=6,<7"
]

[project.optional-dependencies]
live = ["gtfs-realtime-bindings>=1.0,<2"]
dev = ["pytest>=8,<10", "pytest-cov>=5,<7", "ruff>=0.6,<1", "mypy>=1.11,<2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["berlin_urban_intelligence"]
