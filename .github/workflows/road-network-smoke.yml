name: Road network smoke

on:
  push:
    paths:
      - .github/workflows/road-network-smoke.yml
      - scripts/road_network_smoke.py
      - src/berlin_urban_intelligence/adapters/osm_network.py
      - src/berlin_urban_intelligence/runtime/road_readiness.py
  workflow_dispatch:
    inputs:
      place:
        description: OSMnx place query for the Berlin smoke scope
        required: true
        default: "Mitte, Berlin, Germany"
        type: string
      network_type:
        description: OSMnx network type
        required: true
        default: drive
        type: choice
        options:
          - drive
          - drive_service
      overpass_url:
        description: Preferred OSMnx Overpass base API URL
        required: true
        default: "https://maps.mail.ru/osm/tools/overpass/api"
        type: string
  schedule:
    - cron: "23 4 * * 1"

permissions:
  contents: read

concurrency:
  group: road-network-smoke-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install real OSM acquisition dependencies
        run: pip install -e ".[osm]"
      - name: Verify real Berlin road-network acquisition and routing readiness
        env:
          PLACE: "${{ inputs.place || 'Mitte, Berlin, Germany' }}"
          NETWORK_TYPE: "${{ inputs.network_type || 'drive' }}"
          PREFERRED_OVERPASS_URL: "${{ inputs.overpass_url || 'https://maps.mail.ru/osm/tools/overpass/api' }}"
        run: |
          set +e
          endpoints=(
            "$PREFERRED_OVERPASS_URL"
            "https://overpass.private.coffee/api"
            "https://overpass-api.de/api"
          )
          seen=()
          attempt=0
          success=0

          for endpoint in "${endpoints[@]}"; do
            duplicate=0
            for previous in "${seen[@]}"; do
              if [[ "$previous" == "$endpoint" ]]; then
                duplicate=1
                break
              fi
            done
            if [[ "$duplicate" -eq 1 ]]; then
              continue
            fi
            seen+=("$endpoint")
            attempt=$((attempt + 1))
            output="road-network-smoke-attempt-${attempt}.json"

            echo "Road-network smoke attempt ${attempt}: ${endpoint}"
            timeout --signal=TERM 300s python scripts/road_network_smoke.py \
              --place "$PLACE" \
              --network-type "$NETWORK_TYPE" \
              --overpass-url "$endpoint" \
              --allow-osmnx-speed-imputation \
              --output "$output"
            rc=$?

            if [[ "$rc" -eq 0 ]]; then
              cp "$output" road-network-smoke.json
              printf '%s\n' "$endpoint" > road-network-selected-endpoint.txt
              success=1
              break
            fi

            if [[ "$rc" -eq 124 ]]; then
              ATTEMPT_ENDPOINT="$endpoint" ATTEMPT_OUTPUT="$output" python - <<'PY'
          import json
          import os
          from pathlib import Path

          payload = {
              "overpass_url": os.environ["ATTEMPT_ENDPOINT"],
              "status": "failed",
              "error_type": "TimeoutExceeded",
              "error": "Live Overpass attempt exceeded the workflow's 300 second endpoint budget.",
              "synthetic_fallback": False,
          }
          Path(os.environ["ATTEMPT_OUTPUT"]).write_text(
              json.dumps(payload, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY
            fi
          done

          if [[ "$success" -ne 1 ]]; then
            echo "No configured public Overpass delivery endpoint produced routing-ready evidence."
            exit 2
          fi
      - name: Upload point-in-time smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: road-network-smoke-evidence
          path: |
            road-network-smoke*.json
            road-network-selected-endpoint.txt
          if-no-files-found: error
          retention-days: 30
