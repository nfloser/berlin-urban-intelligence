name: Format once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/format-once.yml

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev,live]'
      - name: Apply safe formatter and lint fixes
        run: |
          ruff format src tests scripts
          ruff check --fix src tests scripts || true
      - name: Commit formatter output
        run: |
          if git diff --quiet; then
            echo 'No formatting changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src tests scripts
          git commit -m 'style: apply repository formatting'
          git push origin HEAD:main
