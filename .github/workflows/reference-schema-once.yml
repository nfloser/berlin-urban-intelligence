name: Reference schema diagnostic

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/reference-schema-once.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install httpx
      - name: Inspect current upstream schemas
        shell: python
        run: |
          import csv
          import io
          import json
          import zipfile
          from xml.etree import ElementTree as ET
          import httpx

          client = httpx.Client(timeout=60.0, follow_redirects=True, headers={"User-Agent": "berlin-urban-intelligence-schema-diagnostic/1"})
          wfs_urls = {
              "hospitals": "https://gdi.berlin.de/services/wfs/krankenhaeuser",
              "fire": "https://gdi.berlin.de/services/wfs/feuerwehr",
              "climate": "https://gdi.berlin.de/services/wfs/ua_klimaanalyse_2022",
          }

          def local(tag):
              return tag.rsplit("}", 1)[-1]

          for label, url in wfs_urls.items():
              print(f"=== {label} capabilities ===")
              r = client.get(url, params={"service":"WFS","request":"GetCapabilities","version":"2.0.0"})
              print("status", r.status_code, "final", r.url, "type", r.headers.get("content-type"))
              print("prefix", r.text[:300].replace("\n", " "))
              r.raise_for_status()
              root = ET.fromstring(r.content)
              names = []
              for ft in root.iter():
                  if local(ft.tag) != "FeatureType":
                      continue
                  for child in ft:
                      if local(child.tag) == "Name" and child.text:
                          names.append(child.text.strip())
                          break
              print("feature_types", json.dumps(names, ensure_ascii=False))
              for name in names[:3]:
                  print(f"--- sample {name} ---")
                  g = client.get(url, params={"service":"WFS","version":"2.0.0","request":"GetFeature","typeNames":name,"outputFormat":"application/json","srsName":"EPSG:4326","count":1})
                  print("status", g.status_code, "type", g.headers.get("content-type"), "prefix", g.text[:1000].replace("\n", " "))

          print("=== VBB static ===")
          r = client.get("https://unternehmen.vbb.de/gtfs")
          print("status", r.status_code, "final", r.url, "type", r.headers.get("content-type"), "bytes", len(r.content))
          print("prefix", r.content[:200])
          try:
              z = zipfile.ZipFile(io.BytesIO(r.content))
              print("zip_names", json.dumps(z.namelist()[:40], ensure_ascii=False))
              for wanted in ("stops.txt", "routes.txt", "trips.txt"):
                  candidates = [n for n in z.namelist() if n == wanted or n.endswith("/" + wanted)]
                  print(wanted, "candidates", candidates[:5])
                  if candidates:
                      with z.open(candidates[0]) as raw:
                          text = io.TextIOWrapper(raw, encoding="utf-8-sig", newline="")
                          reader = csv.DictReader(text)
                          print(wanted, "fields", reader.fieldnames)
                          print(wanted, "first", next(reader, None))
          except Exception as exc:
              print("zip_error", type(exc).__name__, str(exc))
