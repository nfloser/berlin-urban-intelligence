name: Reference climate diagnostic

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/reference-schema-once.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[live]"
      - name: Diagnose selected climate layers
        shell: python
        run: |
          import traceback
          from datetime import UTC, datetime
          from berlin_urban_intelligence.adapters.berlin_wfs import BerlinWfsClient
          from berlin_urban_intelligence.agents.heat import HeatAgent
          from berlin_urban_intelligence.runtime.reference_refresh import ReferenceRefreshCoordinator

          client = BerlinWfsClient(ReferenceRefreshCoordinator.CLIMATE_URL)
          heat = HeatAgent()
          advertised = client.feature_types()
          by_local = {name.split(':', 1)[-1]: name for name in advertised}
          for local_name in ReferenceRefreshCoordinator.CLIMATE_LAYER_LOCAL_NAMES:
              name = by_local[local_name]
              print(f'=== {name} ===')
              try:
                  payload = client.fetch_all_geojson(name)
                  print('features=', len(payload.get('features', [])))
                  features = heat.ingest_official_climate_features(
                      payload,
                      feature_type=name,
                      retrieved_at=datetime.now(UTC),
                  )
                  print('normalized=', len(features))
              except Exception as exc:
                  print(type(exc).__name__, str(exc))
                  traceback.print_exc()
