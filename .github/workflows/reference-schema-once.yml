name: Reference source smoke

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/reference-schema-once.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[live]"
      - name: Run full reference refresh
        run: python scripts/refresh_reference.py --state /tmp/reference.json --rdf /tmp/reference.ttl
      - name: Verify persisted reference state
        shell: python
        run: |
          import json
          from pathlib import Path

          state = json.loads(Path('/tmp/reference.json').read_text(encoding='utf-8'))
          errors = state.get('errors', {})
          facilities = state.get('critical_facilities', [])
          climate = state.get('official_model_features', [])
          stops = state.get('transport_stops', [])
          suspect_climate = [item for item in climate if item.get('quality') == 'suspect']
          print('errors=', errors)
          print('critical_facilities=', len(facilities))
          print('official_model_features=', len(climate))
          print('suspect_climate_features=', len(suspect_climate))
          print('transport_stops=', len(stops))
          assert not errors, errors
          assert facilities, 'no critical facilities persisted'
          assert climate, 'no climate features persisted'
          assert stops, 'no VBB transport stops persisted'
