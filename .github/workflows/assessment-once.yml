name: Integrate assessment endpoint once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/assessment-once.yml

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e '.[dev,live]'
      - name: Add assessment API and tests
        run: |
          python - <<'PY'
          from pathlib import Path

          app = Path('src/berlin_urban_intelligence/api/app.py')
          text = app.read_text(encoding='utf-8')
          old = '''from berlin_urban_intelligence.orchestrator.engine import (\n    OrchestrationRequest,\n    Orchestrator,\n)\n'''
          new = '''from berlin_urban_intelligence.orchestrator.assessment import (\n    AssessmentRequest,\n    IntegratedAssessmentService,\n)\nfrom berlin_urban_intelligence.orchestrator.engine import (\n    OrchestrationRequest,\n    Orchestrator,\n)\n'''
          if old not in text:
              raise SystemExit('orchestrator import anchor missing')
          text = text.replace(old, new, 1)

          anchor = '''    @app.get("/api/v1/graph", response_class=PlainTextResponse)\n'''
          endpoint = '''    @app.post("/api/v1/assess")\n    def assess(request: Request, payload: AssessmentRequest) -> dict[str, object]:\n        reference: ReferenceState | None = request.app.state.reference\n        heat_agent: HeatAgent = request.app.state.agents["heat"]\n        energy_agent: EnergyAgent = request.app.state.agents["energy"]\n        resilience_agent: ResilienceAgent = request.app.state.agents["resilience"]\n        service = IntegratedAssessmentService(\n            heat=heat_agent,\n            energy=energy_agent,\n            resilience=resilience_agent,\n            facilities=reference.critical_facilities if reference else (),\n            network_nodes=reference.network_nodes if reference else (),\n        )\n        return service.assess(payload).model_dump(mode="json")\n\n'''
          if anchor not in text:
              raise SystemExit('graph endpoint anchor missing')
          text = text.replace(anchor, endpoint + anchor, 1)
          app.write_text(text, encoding='utf-8')

          Path('tests/test_assessment.py').write_text('''from pathlib import Path\n\nfrom fastapi.testclient import TestClient\n\nfrom berlin_urban_intelligence.api import app as api_module\nfrom berlin_urban_intelligence.api.app import create_app\n\n\ndef test_assessment_reports_missing_heat_baseline_without_fabrication(\n    monkeypatch, tmp_path: Path\n) -> None:\n    monkeypatch.setattr(api_module, "DEFAULT_RUNTIME_STATE", tmp_path / "missing-runtime.json")\n    monkeypatch.setattr(api_module, "DEFAULT_REFERENCE_STATE", tmp_path / "missing-reference.json")\n    monkeypatch.setattr(api_module, "DEFAULT_ENERGY_STATE", tmp_path / "missing-energy.json")\n    app = create_app()\n    with TestClient(app) as client:\n        response = client.post(\n            "/api/v1/assess",\n            json={\n                "scenario": {\n                    "name": "fixture heat stress",\n                    "kinds": ["extreme_heat"],\n                    "temperature_delta_c": 3.0,\n                }\n            },\n        )\n    assert response.status_code == 200\n    payload = response.json()\n    assert payload["heat"] is None\n    assert payload["unavailable_dimensions"] == ["heat"]\n    assert payload["dimension_errors"]["heat"].startswith("INSUFFICIENT_DATA")\n    assert payload["composite_score"] is None\n\n\ndef test_network_assessment_requires_origin_node() -> None:\n    app = create_app()\n    with TestClient(app) as client:\n        response = client.post(\n            "/api/v1/assess",\n            json={\n                "scenario": {\n                    "name": "fixture closure",\n                    "kinds": ["network_disruption"],\n                    "closed_network_edges": ["edge-1"],\n                }\n            },\n        )\n    assert response.status_code == 422\n''', encoding='utf-8')
          PY
          ruff format src tests scripts
          ruff check src tests scripts
          mypy src/berlin_urban_intelligence
          pytest
      - name: Commit endpoint
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/berlin_urban_intelligence/api/app.py tests/test_assessment.py
          git commit -m 'feat: expose integrated scenario assessment API'
          git push origin HEAD:main
