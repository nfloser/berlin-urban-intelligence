name: Live source smoke

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 2,5"

permissions:
  contents: read

jobs:
  live-sources:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[live]"
      - run: python scripts/live_smoke.py
