name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev,live]"
      - run: ruff format --check src tests scripts
      - run: ruff check src tests scripts
      - run: mypy src/berlin_urban_intelligence
      - run: pytest --cov=berlin_urban_intelligence --cov-report=term-missing
      - run: python scripts/validate_knowledge.py
      - run: python scripts/check_production_data.py
      - run: python scripts/check_secrets.py
      - name: Validate OpenAPI generation
        run: python -c "from berlin_urban_intelligence.api.app import create_app; schema=create_app().openapi(); assert schema['openapi']; print(schema['info']['version'])"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run build

  containers:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install isolated pinned Playwright acceptance runner
        run: |
          set -euo pipefail
          rm -rf /tmp/bui-playwright
          mkdir -p /tmp/bui-playwright
          cd /tmp/bui-playwright
          npm init -y >/dev/null
          npm install --save-exact @playwright/test@1.63.0 @axe-core/playwright@4.13.0
          cp -R "$GITHUB_WORKSPACE/frontend/e2e" ./e2e
          cp "$GITHUB_WORKSPACE/frontend/playwright.config.ts" ./playwright.config.ts
          npx playwright install --with-deps chromium
      - run: docker compose config
      - run: docker build -t berlin-urban-intelligence:ci .
      - name: Seed deterministic browser acceptance persisted state
        run: |
          mkdir -p data/runtime
          docker run --rm --user 0 \
            -v "$PWD/data:/app/data" \
            berlin-urban-intelligence:ci \
            python scripts/write_acceptance_fixtures.py \
            --reference /app/data/runtime/reference.json \
            --runtime /app/data/runtime/state.json \
            --derived /app/data/runtime/derived.json \
            --traffic-disruptions /app/data/runtime/traffic-disruptions.json
      - run: docker build -t berlin-urban-intelligence-dashboard:ci frontend
      - name: Start composed stack and verify HTTP and browser behavior
        run: |
          set -euo pipefail
          trap 'docker compose down -v' EXIT
          docker compose up -d --build backend frontend
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8000/health >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              docker compose ps
              docker compose logs backend frontend
              exit 1
            fi
            sleep 2
          done
          for attempt in $(seq 1 15); do
            if curl --fail --silent http://127.0.0.1:8080/ >/dev/null \
              && curl --fail --silent http://127.0.0.1:8080/health >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 15 ]; then
              docker compose ps
              docker compose logs backend frontend
              exit 1
            fi
            sleep 1
          done
          (cd /tmp/bui-playwright && BUI_E2E_BASE_URL=http://127.0.0.1:8080 npx playwright test)
          docker compose ps
