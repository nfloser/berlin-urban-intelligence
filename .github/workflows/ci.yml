name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev,live]"
      - run: ruff format --check src tests scripts
      - run: ruff check src tests scripts
      - run: mypy src/berlin_urban_intelligence
      - run: pytest --cov=berlin_urban_intelligence --cov-report=term-missing
      - run: python scripts/validate_knowledge.py
      - run: python scripts/check_production_data.py
      - run: python scripts/check_secrets.py
      - name: Validate OpenAPI generation
        run: python -c "from berlin_urban_intelligence.api.app import create_app; schema=create_app().openapi(); assert schema['openapi']; print(schema['info']['version'])"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run build

  containers:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config
      - run: docker build -t berlin-urban-intelligence:ci .
      - run: docker build -t berlin-urban-intelligence-dashboard:ci frontend
