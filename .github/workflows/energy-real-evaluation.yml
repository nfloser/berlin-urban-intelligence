name: Real Berlin energy evidence

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/energy-real-evaluation.yml"
      - "config/sources.yaml"
      - "docs/energy-real-evidence.md"
      - "docs/data/data-sources.md"
      - "docs/index.md"
      - "docs/verification.md"
      - "scripts/evaluate_energy.py"
      - "src/berlin_urban_intelligence/adapters/stromnetz_berlin.py"
      - "src/berlin_urban_intelligence/agents/energy.py"
      - "src/berlin_urban_intelligence/api/**"
      - "src/berlin_urban_intelligence/energy/**"
      - "tests/test_stromnetz_berlin_adapter.py"

permissions:
  contents: read

env:
  EVIDENCE_URL: https://www.stromnetz.berlin/files/globalassets/dokumente/veroffentlichungspflichten/2024/Jahreshoechstlast-2024-Hochspannung.csv
  EVIDENCE_TITLE: Jahreshöchstlast in der Hochspannung
  EVIDENCE_YEAR: "2024"

jobs:
  source-schema-probe:
    name: source-schema-probe (${{ matrix.label }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: 2025-high-voltage
            url: https://www.stromnetz.berlin/files/globalassets/dokumente/veroffentlichungspflichten/2025/jahreshoechstlast-2025-hochspannung.csv
          - label: 2025-high-medium-voltage
            url: https://www.stromnetz.berlin/files/globalassets/dokumente/veroffentlichungspflichten/2025/jahreshoechstlast-2025-hochspannung-mittelspannung.csv
          - label: 2025-medium-voltage
            url: https://www.stromnetz.berlin/files/globalassets/dokumente/veroffentlichungspflichten/2025/jahreshoechstlast-2025-mittelspannung.csv
          - label: 2025-medium-low-voltage
            url: https://www.stromnetz.berlin/files/globalassets/dokumente/veroffentlichungspflichten/2025/jahreshoechstlast-2025-mittelspannung-niederspannung.csv
          - label: 2025-low-voltage
            url: https://www.stromnetz.berlin/files/globalassets/dokumente/veroffentlichungspflichten/2025/jahreshoechstlast-2025-niederspannung.csv
          - label: 2024-high-voltage
            url: https://www.stromnetz.berlin/files/globalassets/dokumente/veroffentlichungspflichten/2024/Jahreshoechstlast-2024-Hochspannung.csv
    steps:
      - name: Fetch official CSV without committing provider data
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --retry-all-errors \
            --connect-timeout 20 --max-time 120 \
            --output /tmp/source.csv \
            "${{ matrix.url }}"
          test -s /tmp/source.csv
      - name: Report source identity, schema and integrity signals
        run: |
          python - <<'PY'
          from collections import Counter
          from datetime import datetime
          from hashlib import sha256
          from pathlib import Path

          path = Path('/tmp/source.csv')
          payload = path.read_bytes()
          text = None
          encoding = None
          for candidate in ('utf-8-sig', 'cp1252', 'latin-1'):
              try:
                  text = payload.decode(candidate)
                  encoding = candidate
                  break
              except UnicodeDecodeError:
                  continue
          if text is None or encoding is None:
              raise SystemExit('unable to decode source CSV')

          lines = [line for line in text.splitlines() if line.strip()]
          if len(lines) < 12:
              raise SystemExit('source CSV does not contain expected metadata/data rows')
          data_rows = lines[9:]
          values = []
          invalid_labels = []
          date_counts = Counter()
          for index, row in enumerate(data_rows):
              parts = row.split(';')
              if len(parts) < 3:
                  raise SystemExit(f'malformed data row at {index}')
              date_label, time_label, value_label = parts[:3]
              date_counts[date_label] += 1
              try:
                  datetime.strptime(date_label, '%d.%m.%Y')
                  datetime.strptime(time_label, '%H:%M')
              except ValueError:
                  invalid_labels.append((index, date_label, time_label))
              values.append(int(value_label.replace('.', '')))

          declared_max = int(lines[4].split(';')[2].replace('.', ''))
          declared_work = int(lines[5].split(';')[2].replace('.', ''))
          computed_max = max(values)
          integrated_work = round(sum(values) * 0.25)

          print(f'label=${{ matrix.label }}')
          print(f'bytes={len(payload)}')
          print(f'sha256={sha256(payload).hexdigest()}')
          print(f'encoding={encoding}')
          print(f'title={lines[1].split(";")[0]}')
          print(f'year={lines[2].split(";")[0]}')
          print(f'data_rows={len(data_rows)}')
          print(f'unique_date_labels={len(date_counts)}')
          print(f'invalid_label_count={len(invalid_labels)}')
          print(f'invalid_label_sample={invalid_labels[:3]!r}')
          print(f'declared_max_kw={declared_max}')
          print(f'computed_max_kw={computed_max}')
          print(f'declared_work_kwh={declared_work}')
          print(f'integrated_work_kwh={integrated_work}')
          print(f'work_delta_kwh={integrated_work - declared_work}')
          print('non_96_date_counts=' + repr(sorted((day, count) for day, count in date_counts.items() if count != 96)))
          PY

  real-evaluation:
    name: real-2024-evaluation-agent-api
    needs: source-schema-probe
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project runtime
        run: |
          python -m pip install --upgrade pip
          pip install ".[live]"
      - name: Fetch clean official 2024 high-voltage curve
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --retry-all-errors \
            --connect-timeout 20 --max-time 120 \
            --output /tmp/stromnetz-berlin-2024.csv \
            "$EVIDENCE_URL"
          test -s /tmp/stromnetz-berlin-2024.csv
      - name: Evaluate chronologically and persist matching forecast
        run: |
          python scripts/evaluate_energy.py \
            --input /tmp/stromnetz-berlin-2024.csv \
            --source-url "$EVIDENCE_URL" \
            --dataset "Stromnetz Berlin Hochspannungs-Lastkurve 2024" \
            --published-annual-load-curve \
            --expected-title "$EVIDENCE_TITLE" \
            --expected-year "$EVIDENCE_YEAR" \
            --seasonal-lag 96 \
            --test-fraction 0.2 \
            --state /tmp/energy.json | tee /tmp/energy-evaluation.txt
          test -s /tmp/energy.json
      - name: Verify persistence, EnergyAgent guards and API exposure
        env:
          BUI_RUNTIME_STATE: /tmp/missing-runtime.json
          BUI_REFERENCE_STATE: /tmp/missing-reference.json
          BUI_ENERGY_STATE: /tmp/energy.json
          BUI_DERIVED_STATE: /tmp/missing-derived.json
        run: |
          python - <<'PY'
          from fastapi.testclient import TestClient

          from berlin_urban_intelligence.agents.energy import EnergyAgent
          from berlin_urban_intelligence.api.app import create_app
          from berlin_urban_intelligence.energy.state import EnergyStateStore

          state = EnergyStateStore('/tmp/energy.json').load()
          if state is None:
              raise SystemExit('persisted energy state was not readable')
          if not state.forecasts:
              raise SystemExit('real evaluation did not persist a forecast artifact')

          agent = EnergyAgent()
          agent.register_berlin_evaluation(state.evaluation)
          forecast = agent.register_forecast(state.forecasts[0])
          assert forecast.unit == 'kW'
          assert forecast.provenance.dataset == 'Stromnetz Berlin Hochspannungs-Lastkurve 2024'
          assert forecast.provenance.source_url.unicode_string() == '${{ env.EVIDENCE_URL }}'
          assert state.evaluation.dataset_fingerprint == state.forecasts[0].dataset_fingerprint

          with TestClient(create_app()) as client:
              response = client.get('/api/v1/energy')
              assert response.status_code == 200
              body = response.json()
              assert body['evaluation']['dataset_fingerprint'] == state.evaluation.dataset_fingerprint
              assert len(body['forecasts']) == 1
              assert body['forecasts'][0]['unit'] == 'kW'
              assert body['forecasts'][0]['provenance']['dataset'] == 'Stromnetz Berlin Hochspannungs-Lastkurve 2024'
              assert body['health']['freshness'] == 'stale'
          print('persisted_state=accepted')
          print('energy_agent=accepted')
          print('api_energy=visible')
          PY
