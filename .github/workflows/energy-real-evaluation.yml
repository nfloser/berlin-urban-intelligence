name: Real Berlin energy evidence

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/energy-real-evaluation.yml"
      - "scripts/evaluate_energy.py"
      - "src/berlin_urban_intelligence/adapters/stromnetz_berlin.py"
      - "src/berlin_urban_intelligence/energy/**"

permissions:
  contents: read

jobs:
  source-schema-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SOURCE_URL: https://www.stromnetz.berlin/files/globalassets/dokumente/veroffentlichungspflichten/2025/jahreshoechstlast-2025-hochspannung.csv
    steps:
      - name: Fetch current official CSV without committing source data
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --retry-all-errors \
            --connect-timeout 20 --max-time 120 \
            --output /tmp/stromnetz-berlin-2025.csv \
            "$SOURCE_URL"
          test -s /tmp/stromnetz-berlin-2025.csv
      - name: Report source identity and inspected schema
        run: |
          python - <<'PY'
          from collections import Counter
          from datetime import date, datetime, timedelta
          from hashlib import sha256
          from pathlib import Path

          path = Path('/tmp/stromnetz-berlin-2025.csv')
          payload = path.read_bytes()
          text = None
          encoding = None
          for candidate in ('utf-8-sig', 'cp1252', 'latin-1'):
              try:
                  text = payload.decode(candidate)
                  encoding = candidate
                  break
              except UnicodeDecodeError:
                  continue
          if text is None or encoding is None:
              raise SystemExit('unable to decode source CSV')
          lines = [line for line in text.splitlines() if line.strip()]
          if len(lines) < 12:
              raise SystemExit('source CSV does not contain expected metadata/data rows')
          print(f'bytes={len(payload)}')
          print(f'sha256={sha256(payload).hexdigest()}')
          print(f'encoding={encoding}')
          print(f'non_empty_lines={len(lines)}')
          for index, line in enumerate(lines[:12], start=1):
              print(f'line_{index:02d}={line}')
          print(f'last_data_row={lines[-1]}')
          data_rows = lines[9:]
          date_counts = Counter(row.split(';', 1)[0] for row in data_rows)
          print(f'unique_dates={len(date_counts)}')
          print('non_96_date_counts=' + repr(sorted((day, count) for day, count in date_counts.items() if count != 96)))

          parsed_dates = {}
          invalid_dates = []
          for label in date_counts:
              try:
                  parsed_dates[label] = datetime.strptime(label, '%d.%m.%Y').date()
              except ValueError:
                  invalid_dates.append(label)
          expected_dates = {date(2025, 1, 1) + timedelta(days=index) for index in range(365)}
          actual_2025_dates = {value for value in parsed_dates.values() if value.year == 2025}
          outside_year = sorted((label, value.isoformat()) for label, value in parsed_dates.items() if value.year != 2025)
          missing_dates = sorted(value.isoformat() for value in expected_dates - actual_2025_dates)
          print(f'invalid_date_labels={invalid_dates!r}')
          print(f'outside_2025_dates={outside_year!r}')
          print(f'missing_2025_dates={missing_dates!r}')

          invalid_indexes = [index for index, row in enumerate(data_rows) if row.startswith('#BEZUG!;')]
          print(f'invalid_row_count={len(invalid_indexes)}')
          if invalid_indexes:
              first_invalid = invalid_indexes[0]
              last_invalid = invalid_indexes[-1]
              print(f'first_invalid_index={first_invalid}')
              print(f'last_invalid_index={last_invalid}')
              print(f'invalid_first_rows={data_rows[first_invalid:first_invalid + 4]!r}')
              print(f'invalid_last_rows={data_rows[max(0, last_invalid - 3):last_invalid + 1]!r}')
              print(f'invalid_preceding_rows={data_rows[max(0, first_invalid - 4):first_invalid]!r}')
              print(f'invalid_following_rows={data_rows[last_invalid + 1:last_invalid + 5]!r}')

          for day in ('01.01.2025', '02.01.2025', '30.03.2025', '26.10.2025', '31.12.2025'):
              rows = [line for line in data_rows if line.startswith(day + ';')]
              print(f'{day}_row_count={len(rows)}')
              print(f'{day}_first_rows={rows[:4]}')
              print(f'{day}_last_rows={rows[-4:]}')
          PY
