name: Verify live sources once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/live-verify-once.yml

permissions:
  contents: read

jobs:
  live-sources:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[live]"
      - run: python scripts/live_smoke.py
