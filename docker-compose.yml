services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      BUI_RUNTIME_STATE: /app/data/runtime/state.json
    volumes:
      - ./data:/app/data
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).read()"]
      interval: 15s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8080:80"

  refresh:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      BUI_RUNTIME_STATE: /app/data/runtime/state.json
    volumes:
      - ./data:/app/data
    command: ["python", "scripts/refresh_live.py", "--state", "/app/data/runtime/state.json", "--rdf", "/app/data/generated/latest.ttl"]
