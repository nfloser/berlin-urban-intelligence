services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      BUI_RUNTIME_STATE: /app/data/runtime/state.json
      BUI_REFERENCE_STATE: /app/data/runtime/reference.json
      BUI_ENERGY_STATE: /app/data/runtime/energy.json
      BUI_DERIVED_STATE: /app/data/runtime/derived.json
      BUI_TRAFFIC_DISRUPTION_STATE: /app/data/runtime/traffic-disruptions.json
      BUI_TRAFFIC_DISRUPTION_STATE: /app/data/runtime/traffic-disruptions.json
      BUI_SOURCE_REGISTRY: /app/config/sources.yaml
    volumes:
      - ./data:/app/data
    ports:
      - "127.0.0.1:8000:8000"
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).read()"]
      interval: 15s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:80"

  refresh:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      BUI_RUNTIME_STATE: /app/data/runtime/state.json
      BUI_DERIVED_STATE: /app/data/runtime/derived.json
      BUI_TRAFFIC_DISRUPTION_STATE: /app/data/runtime/traffic-disruptions.json
    volumes:
      - ./data:/app/data
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    command:
      [
        "python",
        "scripts/refresh_live.py",
        "--state",
        "/app/data/runtime/state.json",
        "--derived",
        "/app/data/runtime/derived.json",
        "--traffic-disruptions",
        "/app/data/runtime/traffic-disruptions.json",
        "--rdf",
        "/app/data/generated/latest.ttl",
        "--interval-seconds",
        "${BUI_REFRESH_INTERVAL_SECONDS:-300}",
      ]
